[build]
  publish = "dist"
  command = "npm run build"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["sharp"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[headers]]
  for = "/my/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/success"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/apps/*"
  [headers.values]
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/door-script"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "no-store"

# Checkout results and admin. Do not Disallow /success or /cancel in robots.txt:
# a Disallow stops Google from fetching the page, so it never sees this header.
# /admin stays Disallowed in robots.txt; these headers are defense in depth.
[[headers]]
  for = "/success"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/success/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/cancel"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/cancel/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/admin"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Vite outputs content-hashed filenames — safe to cache for 1 year
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML should always revalidate
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sponsors/stats/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/sponsors/edit/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"

# Static files in the publish directory are served before these rules
# (llms.txt, llms-full.txt, sitemap_index.xml, 404.html, assets).
# Do not add a catch-all "/*" -> /index.html 200. That rewrite returned
# the SPA shell with HTTP 200 for unknown URLs and for /llms.txt.
# Paths with no file, function, or rule below fall through to /404.html
# with a real HTTP 404.

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/llms-full.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sitemap_index.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

[[redirects]]
  from = "/advertise"
  to = "/sponsors"
  status = 301
  force = true

# Policy pages live at extensionless URLs (public/<name>/index.html).
# The old *.html URLs 301 here. force is required so a leftover file cannot win.
[[redirects]]
  from = "/terms.html"
  to = "/terms"
  status = 301
  force = true

[[redirects]]
  from = "/terms/index.html"
  to = "/terms"
  status = 301
  force = true

[[redirects]]
  from = "/privacy.html"
  to = "/privacy"
  status = 301
  force = true

[[redirects]]
  from = "/privacy/index.html"
  to = "/privacy"
  status = 301
  force = true

[[redirects]]
  from = "/refund-policy.html"
  to = "/refund-policy"
  status = 301
  force = true

[[redirects]]
  from = "/refund-policy/index.html"
  to = "/refund-policy"
  status = 301
  force = true

[[redirects]]
  from = "/earnings-disclaimer.html"
  to = "/earnings-disclaimer"
  status = 301
  force = true

[[redirects]]
  from = "/earnings-disclaimer/index.html"
  to = "/earnings-disclaimer"
  status = 301
  force = true

# Homepage only. index.html stays the empty SPA shell for the client routes below.
[[redirects]]
  from = "/"
  to = "/home.html"
  status = 200
  force = true

# Client-rendered routes. Server-rendered paths (/blog, /apps/*, /sponsors,
# /aged-corporation-playbook, /sitemap.xml) are Netlify functions and are not listed here.
[[redirects]]
  from = "/success"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/cancel"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/door-script"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/my"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/my/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/sponsors/stats/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/sponsors/edit/*"
  to = "/index.html"
  status = 200
